# Build the Hugo site and deploy it to GitHub Pages.
# Repo settings required once: Settings → Pages → Source = "GitHub Actions",
# and Custom domain = www.jiangyuzeng.com (the CNAME file is not used by Actions deploys).
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Blowfish v3.8.0 supports Hugo 0.163.0 – 0.166.0.
      HUGO_VERSION: 0.166.0
      HUGO_ENVIRONMENT: production
      TZ: America/Edmonton
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      # baseURL comes from config/_default/hugo.toml (the custom domain), so the
      # build does not depend on the Pages custom-domain setting.
      - name: Build with Hugo
        run: |
          hugo --gc --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
