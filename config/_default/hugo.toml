# -- Site Configuration --
# Theme docs: https://blowfish.page/docs/getting-started/

theme = "blowfish"
baseURL = "https://www.jiangyuzeng.com/"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true

enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false

enableEmoji = true

# A personal academic site has no tags/categories pages.
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'

[sitemap]
  changefreq = 'monthly'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]
