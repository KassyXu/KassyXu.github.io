# -- Theme Options --
# Full reference: https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = "slate"
defaultAppearance = "light" # light or dark
autoSwitchAppearance = true # follow the visitor's OS setting

enableSearch = false
enableCodeCopy = false

disableImageOptimization = false
disableTextInHeader = false

fingerprintAlgorithm = "sha512"

[header]
  layout = "fixed-fill-blur"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "landing"
  showRecent = false

# Pages on this site are profile pages, not blog posts, so hide post metadata.
[article]
  showDate = false
  showViews = false
  showLikes = false
  showDateUpdated = false
  showAuthor = false
  showHero = true
  heroStyle = "background" # each page bundle's featured.jpg is its banner
  showBreadcrumbs = false
  showDraftLabel = true
  showEdit = false
  seriesOpened = false
  showHeadingAnchors = true
  showPagination = false
  showReadingTime = false
  showReadingProgress = false
  showTableOfContents = false
  showRelatedContent = false
  showTaxonomies = false
  showAuthorsBadges = false
  showWordCount = false
  showZenMode = false

[list]
  showHero = false
  showBreadcrumbs = false
  showSummary = false
  showTableOfContents = false
  showCards = false
  groupByYear = false

[sitemap]
  excludedKinds = ["taxonomy", "term"]
